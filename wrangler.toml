name = "stratum"
main = "src/index.ts"
compatibility_date = "2026-03-15"
workers_dev = true
preview_urls = false

[vars]
S3_REGION = "us-east-1"

[[d1_databases]]
binding = "DB"
database_name = "stratum-db"
database_id = "3c700793-c1c1-4a9c-ad97-068f7ca9315e"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "CACHE"
bucket_name = "stratum-cache"

[triggers]
crons = ["0 */6 * * *"]  # Every 6 hours: 8 cleanup tasks (expired/orphaned shares, stale multiparts, D1-TG consistency, R2 cache, password locks, orphaned chunks, lifecycle expiration)
