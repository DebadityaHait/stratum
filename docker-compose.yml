services:
  # CF Worker éƒ¨ç½²æœåŠ¡ (ä¸€æ¬¡æ€§, ç”± ./deploy.sh ç¼–æŽ’è°ƒç”¨)
  # ä¸ä¼šéš docker compose up è‡ªåŠ¨å¯åŠ¨, éœ€é€šè¿‡ deploy profile æ˜¾å¼è°ƒç”¨
  deploy:
    build:
      context: .
      dockerfile: Dockerfile.deploy
    env_file: .env
    volumes:
      - ./.env:/app/.env
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-${CF_ACCOUNT_ID:-}}
    restart: "no"
    profiles:
      - deploy

  # Telegram Local Bot API: è§£é™¤æ–‡ä»¶å¤§å°é™åˆ¶ (20MB -> 2GB)
  # éœ€è¦ TELEGRAM_API_ID å’Œ TELEGRAM_API_HASH (ä»Ž https://my.telegram.org èŽ·å–)
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - TELEGRAM_LOCAL=1
    volumes:
      - tg-bot-api-data:/var/lib/telegram-bot-api
    deploy:
      resources:
        limits:
          memory: 512M
    profiles:
      - localapi

  # VPS æœ¬åœ°å¤„ç†æœåŠ¡ (å¤§æ–‡ä»¶ + åª’ä½“å¤„ç†)
  # Tunnel å’Œ Caddy å‡é€šè¿‡ Docker å†…éƒ¨ç½‘ç»œè®¿é—®, æ— éœ€æš´éœ²å®¿ä¸»æœºç«¯å£
  # è°ƒè¯•æ—¶å¦‚éœ€ç›´è¿ž: docker compose run -p 3000:3000 processor
  processor:
    build: ./processor
    restart: unless-stopped
    environment:
      - PORT=3000
      - TG_BOT_TOKEN=${TG_BOT_TOKEN}
      - AUTH_SECRET=${VPS_SECRET}
      - TG_LOCAL_API=${TG_LOCAL_API:-https://api.telegram.org}
      - DEFAULT_CHAT_ID=${DEFAULT_CHAT_ID}
      - TEMP_DIR=/tmp/stratum
    volumes:
      - processor-data:/tmp/stratum
    deploy:
      resources:
        limits:
          memory: 2G

  # Cloudflare Tunnel: å®‰å…¨æš´éœ² processor ç»™ CF Worker, æ— éœ€å¼€æ”¾å…¬ç½‘ç«¯å£
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    depends_on:
      - processor
    profiles:
      - tunnel

volumes:
  processor-data:
  tg-bot-api-data:
